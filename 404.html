<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost the path · Ars Tantra</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --void:#080706; --gold:#b8860b; --gold-light:#d4a843;
    --cream:#f0e8d8; --muted:#7a6e62; --border:rgba(184,134,11,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--void); color:var(--cream);
    font-family:'Raleway',sans-serif; font-weight:300;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:40px; overflow:hidden;
  }
  .ornament { font-size:11px; letter-spacing:8px; text-transform:uppercase; color:var(--gold); margin-bottom:32px; }
  .code { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(80px,18vw,180px); line-height:0.9; color:var(--gold-light); font-style:italic; }
  h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(26px,4vw,40px); color:#faf6ef; margin:24px 0 12px; }
  p { font-size:14px; color:var(--muted); line-height:1.8; max-width:440px; margin:0 auto 12px; }
  p.it { font-style:italic; }
  .divider { width:1px; height:48px; background:linear-gradient(to bottom,var(--gold),transparent); margin:32px auto; }
  .cta { display:inline-block; border:1px solid var(--gold); color:var(--gold-light); font-size:9px; letter-spacing:4px; text-transform:uppercase; padding:14px 36px; text-decoration:none; transition:all 0.4s; margin-top:8px; }
  .cta:hover { background:var(--gold); color:var(--void); letter-spacing:6px; }
  .logo { font-family:'Cinzel',serif; font-size:13px; letter-spacing:5px; color:var(--gold-light); text-decoration:none; margin-top:56px; opacity:0.7; }
</style>
</head>
<body>
  <div class="ornament">✦ &nbsp; Ferrara, Italy &nbsp; ✦</div>
  <div class="code">404</div>
  <h1>This path leads nowhere <em>— yet.</em></h1>
  <p>The page you are looking for has wandered off, or never existed.</p>
  <p class="it">La pagina che cerchi si è persa per strada, o non è mai esistita.</p>
  <div class="divider"></div>
  <a href="/" class="cta">Return home · Torna alla home</a>
  <a href="/" class="logo">ARS TANTRA</a>
</body>
</html>
